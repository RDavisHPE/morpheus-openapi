type: object
properties:
  id:
    type: integer
    format: int64
  name:
    type: string
  code:
    type:
      - string
      - 'null'
  datastoreType:
    type: object
    properties:
      id:
        type: integer
        format: int64
      code:
        type: string
        description: Code for the datastore type
      name:
          type: string
          description: Name of the datastore type
  config:
    type: object
    description: Configuration object. Settings vary by type.
    additionalProperties: true
  storageServer:
    type: object
    properties:
      id:
        type: integer
        format: int64
  type:
    type: string
    description: The underlying type of the datastore, e.g. 'generic', 'cluster', 'nfs', 'vmfs', 'NFS Pool', 'Directory Pool', 'GFS2 Pool (Global File System 2)', 'storage-profile', 'ext'
  status:
    type: string
    description: The current status of the datastore, e.g. 'provisioned', 'provisioning', 'failed', 'warning'
  visibility:
    type: string
  storageSize:
    type:
      - integer
      - 'null'
    format: int64
  freeSpace:
    type:
      - integer
      - 'null'
    format: int64
  drsEnabled:
    type: boolean
  active:
    type: boolean
  allowWrite:
    type: boolean
  defaultStore:
    type: boolean
  online:
    type: boolean
  allowRead:
    type: boolean
  allowProvision:
    type: boolean
  refType:
    type: string
    description: Type of the resource this datastore is associated with, e.g. 'ComputeZone', 'ComputeServerGroup'
  refId:
    type: integer
    format: int64
    description: The ID of the resource this datastore is associated with, e.g. ComputeZone, ComputeServerGroup
  externalId:
    type: string
    description: UUID for the datastore
  zone:
    type: object
    description: The zone (Cloud) this datastore belongs to
    properties:
      id:
        type: integer
        format: int64
  zonePool:
    type: object
    description: The zone pool (resource pool) this datastore belongs to (for some Cloud datastores)
    properties:
      id:
        type: integer
        format: int64
  owner:
    type: object
    properties:
      id:
        type: integer
        format: int64
  tenants:
    type: array
    items:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        defaultStore:
          type: boolean
        defaultTarget:
          type: boolean
  resourcePermissions:
    type: object
    properties:
      allGroups:
        type: boolean
      defaultStore:
        type: boolean
      allPlans:
        type: boolean
      defaultTarget:
        type: boolean
      morpheusResourceType:
        type: string
      morpheusResourceId:
        type: integer
        format: int64
      canManage:
        type: boolean
      all:
        type: boolean
      account:
        type: object
        properties:
          id:
            type: integer
            format: int64
      sites:
        type:
          - array
          - 'null'
        items:
          type: object
      plans:
        type:
          - array
          - 'null'
        items:
          type: object
  datastores:
    type: array
    items:
      type: object
      properties:
        id:
          type: integer
          description: id of the component datastore
        name:
          type: string
          description: Name of the component datastore
  locations:
    type: array
    items:
      type: object
      properties:
        refType:
          type: string
          description: Type of the location, e.g. 'ComputeServer'
        refId:
          type: integer
          format: int64
        status:
          type: string
          description: Status of the location, e.g. 'provisioned', 'provisioning', 'failed', 'warning'
        statusMessage:
          type: string
